# ============================================================================
# petkitchen.com —— 前端静态站点 + /api 同域反代
#
# 放哪：/etc/nginx/conf.d/petkitchen.com.conf
# 前置：npm run build 的产物已放到 /opt/pet-kitchen/web（见 deploy-frontend.sh）
#
# 为什么必须同域反代（而不是让前端直连 124.222.148.45:8787）：
#   ① 消除 CORS 与预检往返；② 8787 不必对公网开放（OPS-03）；
#   ③ 让 VITE_API_BASE_URL 可以留空/填域名，前端 bundle 里不出现 IP。
#
# 配好后跑：certbot --nginx -d petkitchen.com -d www.petkitchen.com
#   certbot 会自动补 443 段与证书路径、并把 80 跳转改成它自己的写法。
# ============================================================================

# /api/sync 限流（PRD 安全取舍：令牌是半公开的写入凭证，给它一个上限）
# 必须在 http 上下文 —— conf.d/*.conf 顶层就是 http，所以写在这里。
# 10 r/s 对「孩子端攒批推送」绰绰有余，突发容忍 20。
limit_req_zone $binary_remote_addr zone=api_sync:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name petkitchen.com www.petkitchen.com;

    # certbot 的 HTTP-01 校验目录，必须放行
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name petkitchen.com www.petkitchen.com;

    # certbot 签发后自动写入；手工部署时按需替换
    ssl_certificate     /etc/letsencrypt/live/petkitchen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petkitchen.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 前端静态产物
    root /opt/pet-kitchen/web;
    index index.html;

    # gzip（拼音发音是 mp3，已压缩，不必再压）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 带 hash 的构建产物：长缓存 + immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # 拼音真人发音（843 个 mp3，文件名稳定，不能 immutable）
    location /audio-py/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    # 入口 HTML 绝不缓存，否则发版后孩子还在跑旧版
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 其余静态文件；找不到就交回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 同步接口：单独限流（精确匹配优先级高于前缀匹配）----
    location = /api/sync {
        limit_req zone=api_sync burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
        proxy_read_timeout 30s;
    }

    # ---- 其余 /api：出题 / 批改 / 跟读评分 / 状态 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 跟读评分要把 16k 单声道 WAV 转成 base64 传上来，给足体积与等待时间
        client_max_body_size 12m;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 探活（OPS-05 的告警探测也打这里），不记访问日志免得刷屏
    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        access_log off;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
